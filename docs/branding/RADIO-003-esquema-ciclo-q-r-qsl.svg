<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Inter,Segoe UI,Arial,sans-serif" role="img" aria-label="Ciclo de comunicación Q, R y QSL">
  <title>Esquema del ciclo Q → R → QSL</title>
  <rect width="900" height="470" rx="24" fill="#F7F9FA"/>
  <text x="60" y="58" font-size="28" font-weight="700" fill="#173A53">Ciclo Q → R → QSL</text>
  <text x="60" y="88" font-size="16" fill="#5D7583">Del código de consulta al acuse de recibo, con fuentes declaradas.</text>

  <g>
    <rect x="60" y="150" width="240" height="180" rx="18" fill="#FFFFFF" stroke="#C9D6DC" stroke-width="2"/>
    <rect x="60" y="150" width="240" height="52" rx="18" fill="#32191D"/>
    <rect x="60" y="184" width="240" height="18" fill="#32191D"/>
    <text x="180" y="184" font-size="20" font-weight="700" fill="#EDF4F5" text-anchor="middle">Códigos Q</text>
    <text x="84" y="236" font-size="14" fill="#32191D">Preguntas y respuestas técnicas.</text>
    <text x="84" y="262" font-size="14" fill="#8B1E1E" font-weight="700">QTH</text><text x="128" y="262" font-size="14" fill="#32191D">= ubicación</text>
    <text x="84" y="288" font-size="14" fill="#8B1E1E" font-weight="700">QSL</text><text x="128" y="288" font-size="14" fill="#32191D">= acuse de recibo</text>
    <text x="84" y="316" font-size="12" fill="#5D7583">Fuente: UIT</text>
  </g>

  <g>
    <rect x="330" y="150" width="240" height="180" rx="18" fill="#FFFFFF" stroke="#C9D6DC" stroke-width="2"/>
    <rect x="330" y="150" width="240" height="52" rx="18" fill="#8B1E1E"/>
    <rect x="330" y="184" width="240" height="18" fill="#8B1E1E"/>
    <text x="450" y="184" font-size="20" font-weight="700" fill="#EDF4F5" text-anchor="middle">Claves R</text>
    <text x="354" y="236" font-size="14" fill="#32191D">Señal y seguridad del tráfico.</text>
    <text x="354" y="262" font-size="14" fill="#8B1E1E" font-weight="700">R-4</text><text x="398" y="262" font-size="14" fill="#32191D">= comprendido</text>
    <text x="354" y="288" font-size="14" fill="#8B1E1E" font-weight="700">R-5</text><text x="398" y="288" font-size="14" fill="#32191D">= repita</text>
    <text x="354" y="316" font-size="12" fill="#5D7583">Fuente: CONAF</text>
  </g>

  <g>
    <rect x="600" y="150" width="240" height="180" rx="18" fill="#FFFFFF" stroke="#C9D6DC" stroke-width="2"/>
    <rect x="600" y="150" width="240" height="52" rx="18" fill="#32191D"/>
    <rect x="600" y="184" width="240" height="18" fill="#32191D"/>
    <text x="720" y="184" font-size="20" font-weight="700" fill="#EDF4F5" text-anchor="middle">QSL</text>
    <text x="624" y="236" font-size="14" fill="#32191D">Acuse: la información</text>
    <text x="624" y="258" font-size="14" fill="#32191D">fue recibida y entendida.</text>
    <text x="624" y="292" font-size="14" fill="#8B1E1E" font-weight="700">Cierra el ciclo</text>
    <text x="624" y="316" font-size="12" fill="#5D7583">Confirmación operativa</text>
  </g>

  <g fill="none" stroke="#8B1E1E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 240h30"/><path d="M318 230l12 10-12 10"/>
    <path d="M570 240h30"/><path d="M588 230l12 10-12 10"/>
    <path d="M720 330v40c0 20-16 36-36 36H216c-20 0-36-16-36-36v-40"/>
    <path d="M170 348l10-14 10 14"/>
  </g>
  <text x="450" y="420" font-size="14" fill="#32191D" text-anchor="middle">Emite consulta (Q) → informa condición (R) → confirma recepción (QSL)</text>
</svg>

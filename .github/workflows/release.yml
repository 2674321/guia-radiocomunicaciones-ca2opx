name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Instalar WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
          pip install weasyprint
      - name: Generar PDFs versionados
        run: |
          python3 build_pdf.py manual_radiocomunicaciones.html "Guia-Radiocomunicaciones-${{ github.ref_name }}.pdf"
          python3 build_pdf.py manual_codigos10_generales.html "Codigos10-BandaCiudadana-${{ github.ref_name }}.pdf"
      - name: Publicar release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            Guia-Radiocomunicaciones-*.pdf
            Codigos10-BandaCiudadana-*.pdf
            docs/qr-tarjeta-imprimible.pdf
            docs/qr-tarjeta-general-imprimible.pdf

name: CI

on:
  push:
    branches: ['**']

jobs:
  integridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Control de integridad del documento
        run: python3 check_integrity.py

name: Links

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 4 * * 1'

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar enlaces en Markdown
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose --no-progress --max-retries 3
            --exclude 'img\.shields\.io'
            './**/*.md'
          fail: true

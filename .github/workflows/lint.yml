name: Lint

on:
  push:
    branches: ['**']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Instalar ruff y black
        run: pip install ruff black
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
